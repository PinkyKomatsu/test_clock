<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Digital Clock</title>

  <style>
    /* =========================================================
       1. Theme tokens (light mode is the default)
       ========================================================= */
    :root {
      --bg:        #f4f6fa;
      --bg-grad:   #e6ebf3;
      --card:      #ffffff;
      --border:    #dde3ec;
      --text:      #1b2330;
      --muted:     #677386;
      --accent:    #2563eb;
      --accent-fg: #ffffff;
      --shadow:    0 10px 40px rgba(20, 30, 50, 0.08);
    }

    /* =========================================================
       2. Dark mode (follows the OS setting via prefers-color-scheme)
       ========================================================= */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0d1117;
        --bg-grad:   #161b24;
        --card:      #161b22;
        --border:    #2a313c;
        --text:      #e6edf3;
        --muted:     #8b95a5;
        --accent:    #4f8cff;
        --accent-fg: #0d1117;
        --shadow:    0 10px 40px rgba(0, 0, 0, 0.45);
      }
    }

    /* =========================================================
       3. Base layout: full-height page, content centered
       ========================================================= */
    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 30%, var(--bg-grad), var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
                   "Yu Gothic UI", "Meiryo", sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    /* =========================================================
       4. Clock card
       ========================================================= */
    .clock {
      width: 100%;
      max-width: 760px;
      padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    /* Numeric date line: "2026/09/26 (Sat)" */
    .date {
      margin: 0;
      font-size: clamp(1.25rem, 4.5vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    /* Long-form localized date: "Saturday, September 26, 2026" / "2026年9月26日(土)" */
    .date-long {
      margin: 6px 0 0;
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      color: var(--muted);
    }

    /* Time "HH:MM:SS" — large, digital-clock style.
       A monospace stack plus tabular-nums keeps digits from jumping. */
    .time {
      margin: clamp(16px, 4vw, 28px) 0;
      font-family: "Consolas", "SF Mono", "Menlo", "Cascadia Mono",
                   "Roboto Mono", "Courier New", monospace;
      font-size: clamp(3rem, 15vw, 8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      white-space: nowrap;
    }

    /* Blinking colons, a classic digital-clock touch */
    .time .colon {
      display: inline-block;
      animation: blink 1s steps(1, end) infinite;
    }
    @keyframes blink {
      50% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      .time .colon { animation: none; }
    }

    /* Time zone label */
    .tz {
      margin: 0 0 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* =========================================================
       5. Language toggle button
       ========================================================= */
    .lang-toggle {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      min-height: 44px;              /* comfortable touch target */
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .lang-toggle:hover  { opacity: 0.9; }
    .lang-toggle:active { transform: scale(0.97); }
    .lang-toggle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* =========================================================
       6. Small-screen tweaks (smartphones)
       ========================================================= */
    @media (max-width: 480px) {
      .clock { border-radius: 18px; }
      .tz    { margin-bottom: 20px; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       Markup: date, time, time zone, and language toggle
       ========================================================= -->
  <main class="clock">
    <p class="date" id="date">----/--/-- (---)</p>
    <p class="date-long" id="dateLong">&nbsp;</p>
    <div class="time" id="time" aria-live="off">--:--:--</div>
    <p class="tz" id="tz"></p>
    <button type="button" class="lang-toggle" id="langToggle">English</button>
  </main>

  <script>
    'use strict';

    /* =========================================================
       1. Localized text
       ========================================================= */
    const WEEKDAYS = {
      ja: ['日', '月', '火', '水', '木', '金', '土'],
      en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    };

    const LABELS = {
      ja: { toggle: 'English', tz: 'タイムゾーン', htmlLang: 'ja' },
      en: { toggle: '日本語',  tz: 'Time zone',    htmlLang: 'en' }
    };

    // Long-form date formatters (browser's built-in Intl API, local time zone)
    const LONG_FORMATTERS = {
      ja: new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }),
      en: new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })
    };

    // The user's local time zone, e.g. "Asia/Tokyo"
    const TIME_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

    /* =========================================================
       2. State: current language (remembered between visits)
       ========================================================= */
    const STORAGE_KEY = 'clock-lang';
    let lang = 'ja';
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === 'ja' || saved === 'en') lang = saved;
    } catch (e) { /* storage unavailable (e.g. file:// restrictions) — use default */ }

    /* =========================================================
       3. DOM references
       ========================================================= */
    const elDate     = document.getElementById('date');
    const elDateLong = document.getElementById('dateLong');
    const elTime     = document.getElementById('time');
    const elTz       = document.getElementById('tz');
    const elToggle   = document.getElementById('langToggle');

    /* =========================================================
       4. Formatting helpers
       ========================================================= */
    // Zero-pad a number to 2 digits: 7 -> "07"
    const pad2 = (n) => String(n).padStart(2, '0');

    // "YYYY/MM/DD (Day)" using local time
    function formatNumericDate(d) {
      const y  = d.getFullYear();
      const m  = pad2(d.getMonth() + 1);
      const dd = pad2(d.getDate());
      const wd = WEEKDAYS[lang][d.getDay()];
      return `${y}/${m}/${dd} (${wd})`;
    }

    // "HH:MM:SS" (24-hour) as HTML, with colons wrapped for the blink effect
    function formatTimeHTML(d) {
      const colon = '<span class="colon">:</span>';
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(pad2).join(colon);
    }

    // Long-form date; Japanese uses "2026年9月26日(土)" style without the space
    function formatLongDate(d) {
      const s = LONG_FORMATTERS[lang].format(d);
      return lang === 'ja' ? s.replace(/\s*\(/, '(') : s;
    }

    /* =========================================================
       5. Rendering
       ========================================================= */
    // Update date and time (called every second)
    function render() {
      const now = new Date();
      elDate.textContent     = formatNumericDate(now);
      elDateLong.textContent = formatLongDate(now);
      elTime.innerHTML       = formatTimeHTML(now);
      elTime.setAttribute('aria-label', now.toLocaleTimeString(lang === 'ja' ? 'ja-JP' : 'en-US', { hour12: false }));
    }

    // Update language-dependent static labels
    function applyLanguage() {
      document.documentElement.lang = LABELS[lang].htmlLang;
      elToggle.textContent = LABELS[lang].toggle;
      elToggle.setAttribute('aria-label',
        lang === 'ja' ? 'Switch to English' : '日本語に切り替え');
      elTz.textContent = `${LABELS[lang].tz}: ${TIME_ZONE}`;
      render();
    }

    /* =========================================================
       6. Language toggle
       ========================================================= */
    elToggle.addEventListener('click', () => {
      lang = (lang === 'ja') ? 'en' : 'ja';
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* ignore */ }
      applyLanguage();
    });

    /* =========================================================
       7. Start the clock
       Render immediately, then wait until the next whole second
       so the setInterval ticks line up with the real clock.
       ========================================================= */
    applyLanguage();
    setTimeout(() => {
      render();
      setInterval(render, 1000);
    }, 1000 - (Date.now() % 1000));
  </script>
</body>
</html>
